<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>∇.js playground</title>
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>

<body>
    <div id="root">
        <!-- Elements to be injected here -->
    </div>
</body>
<script type="module">
    import hljs from "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/es/highlight.min.js"
    const isGithub = window.location.host === "pedroth.github.io";
    const SOURCE = isGithub ? "/nabla.js" : "";


    const { DOM, useState, debounce, svg, codeEval, NablaStorage } = await import(SOURCE + "/io/index.js")

    //========================================================================================
    /*                                                                                      *
     *                                         UTILS                                        *
     *                                                                                      */
    //========================================================================================

    function saveToLocalStorage() {
        NablaStorage.setItem("AppState", AppState.cells.map(x => x.serialize()))
    }

    function highlightCode(code) {
        return hljs.highlight(
            code,
            { language: "javascript" }
        ).value;
    }

    // ChatGPT
    function saveCursorPosition(editableDiv) {
        let cursorOffset = 0;
        const selection = window.getSelection();
        if (selection.rangeCount > 0) {
            const range = selection.getRangeAt(0);
            const preCaretRange = range.cloneRange();
            preCaretRange.selectNodeContents(editableDiv);
            preCaretRange.setEnd(range.endContainer, range.endOffset);
            cursorOffset = preCaretRange.toString().length; // Save the character offset
        }
        return cursorOffset;
    }

    // ChatGPT with some changes
    function restoreCursorPosition(cursorOffset, editableDiv) {
        const selection = window.getSelection();
        const range = document.createRange();
        let currentOffset = 0;

        function traverseNodes(node) {
            if (node.nodeType === Node.TEXT_NODE) {
                const nodeLength = node.textContent.length;
                if (currentOffset + nodeLength >= cursorOffset) {
                    range.setStart(node, cursorOffset - currentOffset);
                    range.setEnd(node, cursorOffset - currentOffset);
                    selection.removeAllRanges();
                    selection.addRange(range);
                    return true;
                } else {
                    currentOffset += nodeLength;
                }
            } else {
                for (let i = 0; i < node.childNodes.length; i++) {
                    if (traverseNodes(node.childNodes[i])) {
                        return true;
                    }
                }
            }
            return false;
        }
        traverseNodes(editableDiv);
    }


    //========================================================================================
    /*                                                                                      *
     *                                          UI                                          *
     *                                                                                      */
    //========================================================================================

    function getCellIndex(cell) {
        return AppState.cells.indexOf(cell) + 1;
    }

    function refreshCellNumbers() {
        AppState.cells.forEach((c, i) => {
            const el = DOM.ofId(c.id).map(e => {
                const numEl = e.element.querySelector('.cell-number');
                if (numEl) numEl.textContent = `[${i + 1}]`;
            })
        });
    }

    function delCell(cell) {
        const { getCellState, setCellState } = cell;
        const { id, input } = getCellState();
        AppState.cellsContainer.element.removeChild(document.getElementById(id));
        AppState.cells = AppState.cells.filter(p => p.id !== id);
        refreshCellNumbers();
    }

    async function evalCell(cell) {
        const { getCellState, setCellState } = cell;
        const code = AppState.cells
            .slice(0, getCellIndex(cell))
            .map(c => c.getCellState().input)
            .join("\n");
        const result = await codeEval(code);
        setCellState(() => ({ output: result }));
    }

    function cellInput(cell) {
        const { getCellState, setCellState, onCellStateChange } = cell;
        const { input } = getCellState();
        const codeDOM = DOM.of("code")
            .addClass("grow")
            .attr("contenteditable", true)
            .attr("spellcheck", false)
            .inner(highlightCode(input))
            .event("input",
                debounce(
                    e => {
                        setCellState(() => ({ input: e.target.textContent }))
                        saveToLocalStorage();
                    }
                )
            )
            .event("keydown", (e) => {
                if (e.key === 'Enter' && e.shiftKey) {
                    e.preventDefault();
                    evalCell(cell);
                    saveToLocalStorage();
                }
                if (e.key === 'Tab') {
                    e.preventDefault();
                    document.execCommand('insertText', false, '  ');
                }
            });

        onCellStateChange(({ input }) => {
            const hlCode = highlightCode(input);
            codeDOM.map(raw => {
                const cursorOffset = saveCursorPosition(raw);
                codeDOM.inner(hlCode);
                restoreCursorPosition(cursorOffset, raw);
            })
        })
        const inputDOM = DOM.of("pre")
            .addClass("cell-input")
            .appendChild(
                codeDOM
            )
        return inputDOM;
    }

    function cellOutput(cell) {
        const { onCellStateChange, getCellState } = cell;
        const { output } = getCellState(); // initial state
        const outputDOM = DOM.of("pre").addClass("cell-output").inner(output);
        onCellStateChange(({ output }) => {
            outputDOM.inner(output);
        })
        return outputDOM;
    }

    function delBtn(cell) {
        return DOM.of("button")
            .attr("title", "delete cell")
            .addClass("iconBtn")
            .style(`color:var(--secondary-color)`)
            .inner(svg(`${SOURCE}/assets/garbage.svg`))
            .event("click", () => { delCell(cell); saveToLocalStorage() });
    }

    function runBtn(cell) {
        return DOM.of("button")
            .attr("title", "run cell (shift+enter)")
            .addClass("iconBtn")
            .style(`color:var(--tertiary-color)`)
            .inner(svg(`${SOURCE}/assets/play.svg`))
            .event("click", () => { evalCell(cell); saveToLocalStorage() });
    }

    function renderCell(cell) {
        const idx = getCellIndex(cell);
        const ans = DOM.of("div")
            .attr("id", cell.id)
            .addClass("cell")
            .appendChild(
                DOM.of("div")
                    .addClass("cell-header")
                    .appendChild(
                        DOM.of("span")
                            .addClass("cell-number")
                            .inner(`[${idx}]`),
                        DOM.of("div")
                            .addClass("cell-toolbar")
                            .appendChild(
                                runBtn(cell),
                                delBtn(cell)
                            )
                    ),
                cellInput(cell),
                cellOutput(cell)
            );

        return ans;
    }

    function renderCells() {
        const cells = AppState.cells;
        return cells.map(cell => renderCell(cell));
    }

    function addCellBtn(cellsContainer) {
        const addCellAction = () => {
            const { cells } = AppState;
            const newCell = cell(crypto.randomUUID());
            cells.push(newCell);
            cellsContainer.appendChild(renderCell(newCell));
        }
        window.addEventListener("keydown", (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                addCellAction();
                saveToLocalStorage();
            }
        })
        return DOM.of("button")
            .attr("title", "add new cell (ctrl+enter)")
            .addClass("add-cell-btn")
            .event("click", () => { addCellAction(); saveToLocalStorage(); })
            .appendChild(
                DOM.of("span").inner(svg(`${SOURCE}/assets/plus.svg`)),
                DOM.of("span").inner(" Add cell")
            )
    }

    function main() {
        const container = DOM.of("main");
        const cellsContainer = DOM.of("div")
            .addClass("cells-container")
            .appendChild(...renderCells());
        AppState.cellsContainer = cellsContainer;
        return container
            .appendChild(
                cellsContainer,
                DOM.of("div")
                    .style("padding-top: 0.75rem")
                    .appendChild(
                        addCellBtn(cellsContainer)
                    )
            )
    }

    function footer() {
        return DOM.of("footer")
            .appendChild(
                DOM.of("hr"),
                DOM.of("p")
                    .addClass("center")
                    .inner(`© ${new Date().getFullYear()} Pedroth`)
            )
    }

    function getPermaLink() {
        const url = window.location.href;
        const baseUrl = url.split("#")[0];
        const cellsData = AppState.cells.map(c => {
            const { input } = c.getCellState();
            return { input };
        });
        const encoded = encodeURIComponent(JSON.stringify(cellsData));
        return `${baseUrl}#data=${encoded}`;
    }

    function header() {
        return DOM.of("header")
            .appendChild(
                DOM.of("div")
                    .addClass("playground-header")
                    .appendChild(
                        DOM.of("h1")
                            .appendChild(
                                DOM.of("a")
                                    .attr("href", "https://github.com/pedroth/nabla.js")
                                    .attr("target", "_blank")
                                    .inner("∇ nabla.js")
                            ),
                        DOM.of("button")
                            .addClass("share-btn")
                            .attr("title", "Share permalink")
                            .event("click", () => {
                                const link = getPermaLink();
                                navigator.clipboard.writeText(link).then(() => {
                                    alert("Permalink copied to clipboard!");
                                });
                            })
                            .appendChild(
                                DOM.of("span").inner(svg(`${SOURCE}/assets/share.svg`, "width: 1rem; vertical-align: middle;")),
                                DOM.of("span").inner(" Share")
                            )
                    ),
                DOM.of("hr")
            )
    }

    function renderUI() {
        return DOM.ofId("root")
            .map(root =>
                root.appendChild(header())
                    .appendChild(main())
                    .appendChild(footer())
                    .addClass("loaded")
            )
            .orElse(() => DOM.of("div"));
    }

    function deserializeCell(json) {
        const { id, input, output } = json;
        const c = cell(id);
        c.setCellState(() => ({ input, output }));
        return c;
    }

    function cell(id) {
        const [getCellState, setCellState, onCellStateChange] = useState({ id, input: "", output: "" })
        const ans = {
            id,
            getCellState,
            setCellState,
            onCellStateChange,
            serialize: () => {
                const { id, input, output } = getCellState();
                return { id, input, output };
            }
        };
        return ans;
    }

    //========================================================================================
    /*                                                                                      *
     *                                         MAIN                                         *
     *                                                                                      */
    //========================================================================================


    function getLocalStorageCells() {
        const cells = (NablaStorage.getItem("AppState") ?? []).map(x => deserializeCell(x));
        return cells;
    }

    async function getExampleCells() {
        const hash = window.location.hash;
        const match = hash.match(/example=(\d+)/);
        if (!match) return null;
        const exampleIndex = parseInt(match[1], 10);
        try {
            const examplesRes = await fetch(SOURCE + '/playground/examples.json');
            const examples = await examplesRes.json();
            const example = examples[exampleIndex];
            const testRes = await fetch(SOURCE + example.path);
            const testCells = await testRes.json();
            if (!Array.isArray(testCells) || testCells.length === 0) return null;
            return testCells.map(({ input }) => {
                const c = cell(crypto.randomUUID());
                c.setCellState(() => ({ input: input || "" }));
                return c;
            });
        } catch (e) {
            console.error('Error loading example:', e);
            return null;
        }
    }

    function removeHashFromURL() {
        const url = window.location.href;
        if (url.includes("#")) {
            const newUrl = url.split("#")[0];
            window.history.replaceState({}, document.title, newUrl);
        }
    }

    function getURLData() {
        const url = window.location.href;
        const split = url.split("#data=");
        if (split.length <= 1) return undefined;
        return JSON.parse(decodeURIComponent(split[1]))
            .map(({ input }) => {
                const c = cell(crypto.randomUUID());
                c.setCellState(() => ({ input: input || "" }));
                return c;
            });
    }

    let AppState = { cells: [], cellsContainer: undefined };
    (async () => {
        const exampleCells = await getExampleCells();
        const urlCellsData = getURLData();
        const localStorageCells = getLocalStorageCells();

        AppState = { cells: urlCellsData ?? exampleCells ?? localStorageCells, cellsContainer: undefined }
        renderUI();
        removeHashFromURL();
    })();
</script>

</html>
